# NOTEAI — Render Blueprint
# 대시보드: https://dashboard.render.com → New → Blueprint
#
# 회원/노트/이력이 재배포 후에도 남으려면 PostgreSQL이 필요합니다.
# 이 Blueprint는 noteai-db Postgres를 만들고 DATABASE_URL을 웹 서비스에 연결합니다.
# JWT_SECRET_KEY는 한 번 생성된 값을 유지하세요. 바꾸면 기존 로그인이 전부 풀립니다.
#
# Supabase를 쓰려면 이 databases 블록 대신 대시보드에서
# DATABASE_URL=postgresql://... (Supabase URI) 를 직접 넣으면 됩니다.

databases:
  - name: noteai-db
    plan: basic-256mb
    region: oregon
    databaseName: noteai
    user: noteai

services:
  - type: web
    name: noteai
    runtime: python
    plan: free
    region: oregon

    # 저장소 전체는 클론되고, 빌드/기동 작업 디렉터리만 backend/ 입니다.
    rootDir: backend

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # Render의 파이썬 버전 결정 순서: PYTHON_VERSION 환경변수 > .python-version 파일.
      # 환경변수가 최우선이므로 여기서 못 박습니다. (runtime.txt는 Render가 읽지 않습니다)
      # 3.11로 고정하는 이유: requirements.txt의 핀(SQLAlchemy 2.0.23, FastAPI 0.104.1 등)이
      # 3.11 시절 버전이라, Render 기본값(신규 서비스는 3.14)에서는 SQLAlchemy가 기동에 실패합니다.
      - key: PYTHON_VERSION
        value: "3.11.11"

      - key: DEBUG
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: noteai-db
          property: connectionString

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: MONITOR_AUTOSTART
        value: "true"

      # Cloudinary — 대시보드에서 값을 넣으세요. 비우면 호스팅 기동이 실패합니다.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
