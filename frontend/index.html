<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>NOTEAI 대시보드</title>

  <!-- Pretendard: 한국어 가독성에 강한 모던 산세리프. Inter는 영문 폴백. -->
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /*
      크림톤 미니멀 팔레트
      - cream: 배경/보더
      - paper: 카드 면
      - forest: 포인트(딥 그린)
      - ink: 본문 차콜
    */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: {
              50: '#FFFBF5',
              100: '#F6EEE1',
              200: '#E8DCC8',
              300: '#D9C9B0',
            },
            paper: '#FFFEFB',
            forest: {
              50: '#EEF4F0',
              100: '#D5E4DA',
              200: '#B3CDBB',
              500: '#4A6B57',
              600: '#3D5C4A',
              700: '#2F4A3C',
            },
            ink: {
              DEFAULT: '#2C2925',
              muted: '#6F6A62',
              faint: '#9A948A',
            },
          },
          fontFamily: {
            sans: ['Pretendard', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            soft: '0 1px 2px rgba(44, 41, 37, 0.04), 0 10px 28px rgba(44, 41, 37, 0.05)',
          },
        },
      },
    };
  </script>

  <!--
    지식 그래프 렌더링 라이브러리 (Cytoscape.js)
    - defer로 불러와 초기 페인트를 막지 않습니다.
    - onerror는 CDN 차단/오프라인 상황을 감지해 텍스트 폴백으로 전환합니다.
  -->
  <script defer
          src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"
          onerror="window.__cytoscapeFailed = true;"></script>

  <link rel="stylesheet" href="style.css?v=20260829h">
</head>
<body class="bg-cream-50 text-ink min-h-screen font-sans antialiased">

  <!-- ============================================================
       인증 화면 (로그인 / 회원가입)
       ============================================================ -->
  <section id="loginView" class="hidden min-h-screen items-center justify-center px-4 py-8">
    <div class="w-full max-w-sm bg-paper rounded-2xl shadow-soft border border-cream-200 p-8">
      <div class="flex flex-col items-center text-center mb-6">
        <span class="w-14 h-14 rounded-2xl bg-forest-50 flex items-center justify-center text-2xl mb-3 shadow-soft"
              aria-hidden="true">🧠</span>
        <h1 class="text-xl font-bold tracking-tight">NOTEAI</h1>
        <p id="authSubtitle" class="text-sm text-ink-muted mt-1">
          대시보드를 보려면 로그인하세요.
        </p>
      </div>

      <!-- 로그인/회원가입 전환 탭 -->
      <div class="flex gap-1 p-1 bg-cream-100 rounded-xl mb-5" role="tablist">
        <button type="button" id="tabLogin" role="tab" aria-selected="true" aria-controls="loginForm"
                class="flex-1 text-sm font-medium py-1.5 rounded-lg transition
                       bg-paper text-ink shadow-soft">
          로그인
        </button>
        <button type="button" id="tabSignup" role="tab" aria-selected="false" aria-controls="signupForm"
                class="flex-1 text-sm font-medium py-1.5 rounded-lg transition
                       text-ink-muted hover:text-ink">
          회원가입
        </button>
      </div>

      <!-- ---- 로그인 폼 ---- -->
      <form id="loginForm" class="space-y-4" novalidate>
        <div>
          <label for="username" class="block text-sm font-medium mb-1">사용자명 또는 이메일</label>
          <input id="username" name="username" type="text" autocomplete="username" required
                 placeholder="아이디 또는 이메일"
                 class="w-full rounded-xl border border-cream-300 bg-paper px-3 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-forest-500/25 focus:border-forest-500">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium mb-1">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
                 class="w-full rounded-xl border border-cream-300 bg-paper px-3 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-forest-500/25 focus:border-forest-500">
        </div>

        <p id="loginError" class="hidden text-sm text-red-600 whitespace-pre-line" role="alert"></p>

        <button type="submit" id="loginBtn"
                class="w-full bg-forest-600 hover:bg-forest-700 disabled:bg-forest-200
                       text-cream-50 rounded-xl py-2.5 text-sm font-medium transition">
          로그인
        </button>

        <p class="text-xs text-center text-ink-muted">
          계정이 없으신가요?
          <button type="button" id="goSignup"
                  class="text-forest-600 hover:underline font-medium">회원가입</button>
        </p>
      </form>

      <!-- ---- 회원가입 폼 ---- -->
      <form id="signupForm" class="hidden space-y-4" novalidate>
        <div>
          <label for="signupUsername" class="block text-sm font-medium mb-1">
            사용자명 <span class="text-red-500" aria-hidden="true">*</span>
          </label>
          <input id="signupUsername" name="username" type="text" autocomplete="username" required
                 minlength="3" maxlength="50" placeholder="3자 이상"
                 class="w-full rounded-xl border border-cream-300 bg-paper px-3 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-forest-500/25 focus:border-forest-500">
        </div>

        <div>
          <label for="signupEmail" class="block text-sm font-medium mb-1">
            이메일 <span class="text-red-500" aria-hidden="true">*</span>
          </label>
          <input id="signupEmail" name="email" type="email" autocomplete="email" required
                 placeholder="you@example.com"
                 class="w-full rounded-xl border border-cream-300 bg-paper px-3 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-forest-500/25 focus:border-forest-500">
        </div>

        <div>
          <label for="signupFullName" class="block text-sm font-medium mb-1">
            이름 <span class="text-ink-faint font-normal">(선택)</span>
          </label>
          <input id="signupFullName" name="full_name" type="text" autocomplete="name" maxlength="100"
                 class="w-full rounded-xl border border-cream-300 bg-paper px-3 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-forest-500/25 focus:border-forest-500">
        </div>

        <div>
          <label for="signupPassword" class="block text-sm font-medium mb-1">
            비밀번호 <span class="text-red-500" aria-hidden="true">*</span>
          </label>
          <input id="signupPassword" name="password" type="password" autocomplete="new-password"
                 required minlength="8" placeholder="8자 이상"
                 class="w-full rounded-xl border border-cream-300 bg-paper px-3 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-forest-500/25 focus:border-forest-500">
        </div>

        <div>
          <label for="signupPasswordConfirm" class="block text-sm font-medium mb-1">
            비밀번호 확인 <span class="text-red-500" aria-hidden="true">*</span>
          </label>
          <input id="signupPasswordConfirm" name="passwordConfirm" type="password"
                 autocomplete="new-password" required
                 class="w-full rounded-xl border border-cream-300 bg-paper px-3 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-forest-500/25 focus:border-forest-500">
        </div>

        <p id="signupError" class="hidden text-sm text-red-600 whitespace-pre-line" role="alert"></p>

        <button type="submit" id="signupBtn"
                class="w-full bg-forest-600 hover:bg-forest-700 disabled:bg-forest-200
                       text-cream-50 rounded-xl py-2.5 text-sm font-medium transition">
          가입하고 시작하기
        </button>

        <p class="text-xs text-center text-ink-muted">
          이미 계정이 있으신가요?
          <button type="button" id="goLogin"
                  class="text-forest-600 hover:underline font-medium">로그인</button>
        </p>
      </form>
    </div>
  </section>

  <!-- ============================================================
       대시보드
       ============================================================ -->
  <section id="dashboardView" class="hidden">

    <header class="bg-cream-50/90 backdrop-blur-md border-b border-cream-200 sticky top-0 z-10">
      <!-- ---- 상단 줄: 타이틀 + 전역 컨트롤 ---- -->
      <div class="max-w-7xl mx-auto px-4 sm:px-6 pt-4 flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-2.5">
          <span class="w-8 h-8 rounded-xl bg-forest-600 text-cream-50 flex items-center justify-center text-sm shadow-soft"
                aria-hidden="true">🧠</span>
          <h1 class="text-lg font-bold tracking-tight">NOTEAI</h1>
        </div>

        <!-- 워커 상태 배지 -->
        <span id="workerBadge"
              class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full
                     bg-cream-100 text-ink-muted">
          <span id="workerDot" class="w-1.5 h-1.5 rounded-full bg-ink-faint"></span>
          <span id="workerText">확인 중</span>
        </span>

        <div class="ml-auto flex items-center gap-3">
          <span id="lastUpdated" class="text-xs text-ink-faint" aria-live="polite"></span>

          <label id="autoRefreshLabel"
                 class="flex items-center gap-1.5 text-xs text-ink-muted cursor-pointer">
            <input type="checkbox" id="autoRefresh" checked
                   class="rounded border-cream-300 text-forest-600 focus:ring-forest-500">
            자동 새로고침
          </label>

          <button id="refreshBtn"
                  class="text-xs bg-cream-100 hover:bg-cream-200 px-3 py-1.5 rounded-xl transition">
            🔄 새로고침
          </button>
          <button id="logoutBtn"
                  class="text-xs text-ink-muted hover:text-ink px-2 py-1.5 transition">
            로그아웃
          </button>
        </div>
      </div>

      <!-- ---- 하단 줄: 화면 전환 탭 ---- -->
      <nav class="max-w-7xl mx-auto px-4 sm:px-6" aria-label="주요 화면">
        <div class="flex gap-1 overflow-x-auto" role="tablist">
          <button type="button" id="navMonitor" role="tab" aria-selected="true"
                  aria-controls="panelMonitor" data-view="monitor"
                  class="nav-tab whitespace-nowrap text-sm font-medium px-3 py-3 border-b-2 transition">
            📡 수집 모니터
          </button>
          <button type="button" id="navCuration" role="tab" aria-selected="false"
                  aria-controls="panelCuration" data-view="curation"
                  class="nav-tab whitespace-nowrap text-sm font-medium px-3 py-3 border-b-2 transition">
            📚 노트 큐레이션
          </button>
          <button type="button" id="navGraph" role="tab" aria-selected="false"
                  aria-controls="panelGraph" data-view="graph"
                  class="nav-tab whitespace-nowrap text-sm font-medium px-3 py-3 border-b-2 transition">
            🕸️ 토픽 지식 그래프
          </button>
          <button type="button" id="navPapers" role="tab" aria-selected="false"
                  aria-controls="panelPapers" data-view="papers"
                  class="nav-tab whitespace-nowrap text-sm font-medium px-3 py-3 border-b-2 transition">
            📄 논문 검색
          </button>
        </div>
      </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">

      <!-- 전역 오류 배너 -->
      <div id="errorBanner" class="hidden mb-6 rounded-2xl bg-red-50 border border-red-200 px-4 py-3
                                   text-sm text-red-700" role="alert"></div>

      <!-- ==========================================================
           패널 1: 📡 수집 모니터
           ========================================================== -->
      <div id="panelMonitor" role="tabpanel" aria-labelledby="navMonitor" class="space-y-6">
        <!-- 내용은 pages/monitor.html 에서 주입됩니다 (script.js loadPanels) -->
      </div>

      <!-- ==========================================================
           패널 2: 📚 노트 큐레이션
           ========================================================== -->
      <div id="panelCuration" role="tabpanel" aria-labelledby="navCuration" class="hidden space-y-6">
        <!-- 내용은 pages/curation.html 에서 주입됩니다 (script.js loadPanels) -->
      </div>

      <!-- ==========================================================
           패널 3: 🕸️ 토픽 지식 그래프
           ========================================================== -->
      <div id="panelGraph" role="tabpanel" aria-labelledby="navGraph" class="hidden space-y-6">
        <!-- 내용은 pages/graph.html 에서 주입됩니다 (script.js loadPanels) -->
      </div>

      <!-- ==========================================================
           패널 4: 📄 학술 논문 검색
           ========================================================== -->
      <div id="panelPapers" role="tabpanel" aria-labelledby="navPapers" class="hidden space-y-6">
        <!-- 내용은 pages/papers.html 에서 주입됩니다 (script.js loadPanels) -->
      </div>

    </main>
  </section>

  <!--
    스크립트 로드 순서가 중요합니다.
    script.js가 공용 유틸($, apiFetch, showError)과 init()을 정의하고,
    이어지는 두 파일이 그 유틸을 사용하는 화면별 로직을 정의합니다.
    모든 classic 스크립트는 DOMContentLoaded 이전에 평가되므로
    script.js의 init()에서 initCuration()/initGraph()/initPapers()를 안전하게 호출할 수 있습니다.
  -->
  <script src="script.js?v=20260829h"></script>
  <script src="curation.js?v=20260829h"></script>
  <script src="graph.js?v=20260829h"></script>
  <script src="papers.js?v=20260829h"></script>
</body>
</html>
