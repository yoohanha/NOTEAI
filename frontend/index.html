<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTEAI 수집 모니터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- ============ 인증 화면 (로그인 / 회원가입) ============ -->
  <section id="loginView" class="hidden min-h-screen items-center justify-center px-4 py-8">
    <div class="w-full max-w-sm bg-white rounded-xl shadow-sm border border-slate-200 p-8">
      <h1 class="text-xl font-bold mb-1">NOTEAI 수집 모니터</h1>
      <p id="authSubtitle" class="text-sm text-slate-500 mb-5">
        대시보드를 보려면 로그인하세요.
      </p>

      <!-- 로그인/회원가입 전환 탭 -->
      <div class="flex gap-1 p-1 bg-slate-100 rounded-lg mb-5" role="tablist">
        <button type="button" id="tabLogin" role="tab" aria-selected="true" aria-controls="loginForm"
                class="flex-1 text-sm font-medium py-1.5 rounded-md transition
                       bg-white text-slate-900 shadow-sm">
          로그인
        </button>
        <button type="button" id="tabSignup" role="tab" aria-selected="false" aria-controls="signupForm"
                class="flex-1 text-sm font-medium py-1.5 rounded-md transition
                       text-slate-500 hover:text-slate-700">
          회원가입
        </button>
      </div>

      <!-- ---- 로그인 폼 ---- -->
      <form id="loginForm" class="space-y-4" novalidate>
        <div>
          <label for="username" class="block text-sm font-medium mb-1">사용자명</label>
          <input id="username" name="username" type="text" autocomplete="username" required
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium mb-1">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <p id="loginError" class="hidden text-sm text-red-600 whitespace-pre-line" role="alert"></p>

        <button type="submit" id="loginBtn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300
                       text-white rounded-lg py-2 text-sm font-medium transition">
          로그인
        </button>

        <p class="text-xs text-center text-slate-500">
          계정이 없으신가요?
          <button type="button" id="goSignup"
                  class="text-indigo-600 hover:underline font-medium">회원가입</button>
        </p>
      </form>

      <!-- ---- 회원가입 폼 ---- -->
      <form id="signupForm" class="hidden space-y-4" novalidate>
        <div>
          <label for="signupUsername" class="block text-sm font-medium mb-1">
            사용자명 <span class="text-red-500" aria-hidden="true">*</span>
          </label>
          <input id="signupUsername" name="username" type="text" autocomplete="username" required
                 minlength="3" maxlength="50" placeholder="3자 이상"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label for="signupEmail" class="block text-sm font-medium mb-1">
            이메일 <span class="text-red-500" aria-hidden="true">*</span>
          </label>
          <input id="signupEmail" name="email" type="email" autocomplete="email" required
                 placeholder="you@example.com"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label for="signupFullName" class="block text-sm font-medium mb-1">
            이름 <span class="text-slate-400 font-normal">(선택)</span>
          </label>
          <input id="signupFullName" name="full_name" type="text" autocomplete="name" maxlength="100"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label for="signupPassword" class="block text-sm font-medium mb-1">
            비밀번호 <span class="text-red-500" aria-hidden="true">*</span>
          </label>
          <input id="signupPassword" name="password" type="password" autocomplete="new-password"
                 required minlength="8" placeholder="8자 이상"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label for="signupPasswordConfirm" class="block text-sm font-medium mb-1">
            비밀번호 확인 <span class="text-red-500" aria-hidden="true">*</span>
          </label>
          <input id="signupPasswordConfirm" name="passwordConfirm" type="password"
                 autocomplete="new-password" required
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <p id="signupError" class="hidden text-sm text-red-600 whitespace-pre-line" role="alert"></p>

        <button type="submit" id="signupBtn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300
                       text-white rounded-lg py-2 text-sm font-medium transition">
          가입하고 시작하기
        </button>

        <p class="text-xs text-center text-slate-500">
          이미 계정이 있으신가요?
          <button type="button" id="goLogin"
                  class="text-indigo-600 hover:underline font-medium">로그인</button>
        </p>
      </form>
    </div>
  </section>

  <!-- ============ 대시보드 ============ -->
  <section id="dashboardView" class="hidden">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
        <h1 class="text-lg font-bold">NOTEAI 수집 모니터</h1>

        <!-- 워커 상태 배지 -->
        <span id="workerBadge"
              class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full
                     bg-slate-100 text-slate-600">
          <span id="workerDot" class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
          <span id="workerText">확인 중</span>
        </span>

        <div class="ml-auto flex items-center gap-3">
          <span id="lastUpdated" class="text-xs text-slate-400" aria-live="polite"></span>

          <label class="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer">
            <input type="checkbox" id="autoRefresh" checked
                   class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
            자동 새로고침
          </label>

          <button id="refreshBtn"
                  class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition">
            새로고침
          </button>
          <button id="logoutBtn"
                  class="text-xs text-slate-500 hover:text-slate-800 px-2 py-1.5 transition">
            로그아웃
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

      <!-- 전역 오류 배너 -->
      <div id="errorBanner" class="hidden rounded-lg bg-red-50 border border-red-200 px-4 py-3
                                   text-sm text-red-700" role="alert"></div>

      <!-- ---- 지표 카드 ---- -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <article class="bg-white rounded-xl border border-slate-200 p-4">
          <p class="text-xs text-slate-500 mb-1">24시간 성공률</p>
          <p id="mSuccessRate" class="text-2xl font-bold tabular-nums">–</p>
          <p id="mRunCount" class="text-xs text-slate-400 mt-1">–</p>
        </article>

        <article class="bg-white rounded-xl border border-slate-200 p-4">
          <p class="text-xs text-slate-500 mb-1">신규 저장</p>
          <p id="mSaved" class="text-2xl font-bold tabular-nums">–</p>
          <p id="mFetched" class="text-xs text-slate-400 mt-1">–</p>
        </article>

        <article class="bg-white rounded-xl border border-slate-200 p-4">
          <p class="text-xs text-slate-500 mb-1">누적 트렌드</p>
          <p id="mTotal" class="text-2xl font-bold tabular-nums">–</p>
          <p id="mAvgDuration" class="text-xs text-slate-400 mt-1">–</p>
        </article>

        <article class="bg-white rounded-xl border border-slate-200 p-4">
          <p class="text-xs text-slate-500 mb-1">다음 수집</p>
          <p id="mNextRun" class="text-2xl font-bold tabular-nums">–</p>
          <p id="mLastRun" class="text-xs text-slate-400 mt-1">–</p>
        </article>
      </div>

      <!-- ---- 자가 진단 ---- -->
      <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-200 flex items-center gap-3">
          <h2 class="font-semibold text-sm">자가 진단</h2>
          <span id="verdictBadge"
                class="text-xs font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">–</span>
          <button id="diagnoseBtn"
                  class="ml-auto text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition">
            다시 진단
          </button>
        </div>

        <div class="px-4 py-3">
          <p id="diagSummary" class="text-sm text-slate-600">–</p>
          <div id="diagFindings" class="mt-3 space-y-2"></div>
        </div>
      </section>

      <!-- ---- 실행 이력 ---- -->
      <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-200">
          <h2 class="font-semibold text-sm">최근 수집 이력</h2>
        </div>

        <!-- 좁은 화면에서 표가 페이지를 밀지 않도록 자체 스크롤 -->
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500 text-xs">
              <tr>
                <th scope="col" class="text-left font-medium px-4 py-2">시작 시각</th>
                <th scope="col" class="text-left font-medium px-4 py-2">결과</th>
                <th scope="col" class="text-right font-medium px-4 py-2">시도</th>
                <th scope="col" class="text-right font-medium px-4 py-2">저장</th>
                <th scope="col" class="text-right font-medium px-4 py-2">중복</th>
                <th scope="col" class="text-right font-medium px-4 py-2">소요</th>
                <th scope="col" class="text-left font-medium px-4 py-2">비고</th>
              </tr>
            </thead>
            <tbody id="runsBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>

      <!-- ---- 최신 트렌드 ---- -->
      <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-200">
          <h2 class="font-semibold text-sm">최신 수집 항목</h2>
        </div>
        <ul id="trendsList" class="divide-y divide-slate-100"></ul>
      </section>

    </main>
  </section>

  <script src="script.js"></script>
</body>
</html>
