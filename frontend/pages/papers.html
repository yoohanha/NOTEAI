<!--
  📄 탭 4 · 학술 논문 검색 화면

  이 파일은 index.html의 #panelPapers 컨테이너 안으로 주입되는 조각(partial)입니다.
  단독으로 열면 스타일이 적용되지 않습니다. 반드시 index.html을 통해 보세요.
  주입 시점: script.js의 loadPanels()가 DOMContentLoaded 직후 한 번만 fetch합니다.
-->
<!-- ---- 검색 명령 ---- -->
<section class="bg-paper rounded-2xl border border-cream-200 shadow-soft p-5">
  <div class="flex items-center gap-3 mb-4">
    <span class="w-8 h-8 rounded-xl bg-forest-50 flex items-center justify-center text-sm"
          aria-hidden="true">📄</span>
    <h2 class="font-semibold text-sm">arXiv 실시간 검색</h2>
  </div>

  <form id="papersForm" class="space-y-3" novalidate>
    <div>
      <label for="papersQuery" class="block text-xs text-ink-muted mb-1">검색 명령</label>
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="papersQuery" type="text" required maxlength="200"
               placeholder="/mycode (Text-to-3D)"
               autocomplete="off"
               class="flex-1 rounded-xl border border-cream-300 bg-paper px-3 py-2.5 text-sm font-mono
                      focus:outline-none focus:ring-2 focus:ring-forest-500/25 focus:border-forest-500">
        <button type="submit" id="papersSearchBtn"
                class="bg-forest-600 hover:bg-forest-700 disabled:bg-forest-200
                       text-cream-50 text-sm font-medium px-5 py-2.5 rounded-xl transition">
          🔍 검색
        </button>
      </div>
      <p class="text-[11px] text-ink-faint mt-1.5">
        형식은 <span class="font-mono text-ink-muted">/mycode (검색어)</span> 입니다.
        일반 검색어만 입력하면 자동으로 감쌉니다.
      </p>
    </div>

    <div class="flex flex-col sm:flex-row gap-2">
      <div class="flex-1">
        <label for="papersQuestion" class="block text-xs text-ink-muted mb-1">질문 (선택)</label>
        <input id="papersQuestion" type="text" maxlength="500"
               placeholder="예: 먼저 읽으면 좋은 논문을 추천해 줘"
               class="w-full rounded-xl border border-cream-300 bg-paper px-3 py-2.5 text-sm
                      focus:outline-none focus:ring-2 focus:ring-forest-500/25 focus:border-forest-500">
      </div>
      <label class="flex items-center gap-1.5 text-xs text-ink-muted sm:mt-6">
        <span class="font-medium text-ink-faint">결과 수</span>
        <select id="papersLimit"
                class="rounded-xl border border-cream-300 px-2 py-1 bg-paper
                       focus:outline-none focus:ring-2 focus:ring-forest-500/25 focus:border-forest-500">
          <option value="5">5편</option>
          <option value="8" selected>8편</option>
          <option value="12">12편</option>
          <option value="20">20편</option>
        </select>
      </label>
    </div>

    <p id="papersError" class="hidden text-sm text-red-600" role="alert"></p>
  </form>

  <div class="mt-4">
    <p class="text-xs text-ink-muted mb-2">💡 빠른 검색</p>
    <div id="papersChips" class="flex flex-wrap gap-2">
      <button type="button" data-query="/mycode (Text-to-3D)"
              class="papers-chip text-xs bg-cream-100 hover:bg-cream-200 text-ink px-3 py-1.5 rounded-full transition">
        /mycode (Text-to-3D)
      </button>
      <button type="button" data-query="/mycode (Gaussian Splatting)"
              class="papers-chip text-xs bg-cream-100 hover:bg-cream-200 text-ink px-3 py-1.5 rounded-full transition">
        /mycode (Gaussian Splatting)
      </button>
      <button type="button" data-query="/mycode (Retrieval Augmented Generation)"
              class="papers-chip text-xs bg-cream-100 hover:bg-cream-200 text-ink px-3 py-1.5 rounded-full transition">
        /mycode (RAG)
      </button>
    </div>
  </div>
</section>

<!-- ---- 안내(초기) / 로딩 / 결과 ---- -->
<section id="papersIdle"
         class="bg-paper rounded-2xl border border-dashed border-cream-300 shadow-soft p-12 text-center">
  <p class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-forest-50 flex items-center justify-center text-3xl"
     aria-hidden="true">📄</p>
  <p class="text-sm text-ink-muted font-medium">검색 명령을 입력하면 arXiv에서 논문을 찾아 드립니다</p>
  <p class="text-xs text-ink-faint mt-1">
    초록을 LLM 컨텍스트에 넣어 요약·추천 답변도 함께 생성합니다.
  </p>
</section>

<section id="papersLoading"
         class="hidden bg-paper rounded-2xl border border-cream-200 shadow-soft p-12 text-center">
  <p class="text-sm text-ink-muted animate-pulse">arXiv에서 논문을 검색하는 중…</p>
</section>

<section id="papersResult" class="hidden space-y-4">
  <article id="papersInsight"
           class="bg-paper rounded-2xl border border-cream-200 shadow-soft p-5">
    <div class="flex items-center gap-3 mb-3">
      <span class="w-8 h-8 rounded-xl bg-forest-50 flex items-center justify-center text-sm"
            aria-hidden="true">✨</span>
      <h2 class="font-semibold text-sm">초록 기반 요약 · 추천</h2>
      <span id="papersProvider"
            class="ml-auto text-[11px] bg-cream-100 text-ink-muted px-2 py-0.5 rounded-full"></span>
    </div>
    <p id="papersAnswer" class="text-sm text-ink leading-relaxed whitespace-pre-line"></p>
  </article>

  <div class="flex items-center gap-2 px-1">
    <h2 class="font-semibold text-sm">검색 결과</h2>
    <span id="papersCount" class="text-xs text-ink-faint"></span>
  </div>
  <div id="papersList" class="grid grid-cols-1 gap-4"></div>
</section>

<section id="papersEmpty"
         class="hidden bg-paper rounded-2xl border border-dashed border-cream-300 shadow-soft p-12 text-center">
  <p class="text-sm text-ink-muted font-medium">해당하는 논문을 찾지 못했습니다</p>
  <p class="text-xs text-ink-faint mt-1">다른 검색어로 다시 시도해 보세요.</p>
</section>
